name: CodSpeed

on:
  push:
    branches:
      - "main"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install pytest "pytest-codspeed>=4.3.0"
      - name: Run benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation,memory
          run: pytest tests/ --codspeed
